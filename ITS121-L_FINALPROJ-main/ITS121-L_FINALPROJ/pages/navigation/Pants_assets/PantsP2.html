<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantsP1</title>
    <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="details-page-layout">

    <main class="product-container">
        
        <div class="thumbnails">
            <img src="../../../img/bracelet.png" onclick="changeImage('img/bracelet.png')" alt="thumb">
            <img src="../../../img/bracelet2.png" onclick="changeImage('img/bracelet2.png')" alt="thumb">
            <img src="../../../img/bracelet3.png" onclick="changeImage('img/bracelet3.png')" alt="thumb">
        </div>

        <div class="main-image-section">
            <div class="image-scroll-container">
                <img id="current-img" src="../../../img/bracelet.png" alt="Main Product">
            </div>
            <div class="stock-status">IN STOCK</div>
        </div>

        <aside class="selection-box">
            <h1 class="label">Bracelet</h1>

            <div class="price-section">
                <h1 class="price-text">Price</h1>
                <h2 class="price-amount">$150.00</h2>
            </div>
        </aside>
    </main>


<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Own Js script-->
<script src="js/main.js"></script>
</body>
</html>
