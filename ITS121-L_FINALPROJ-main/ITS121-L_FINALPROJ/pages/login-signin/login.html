<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
            <title> 
                Log In or Sign Up
            </title>
        <link rel="stylesheet" href="../../css/style.css">
<body class="login-body">

<!-- NAVIGATION -->
        <nav class="main-nav">
            <ul>
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../../pages/navigation/newin.html">New In</a></li>
                <li><a href="../../pages/cart/checkout.html">Checkout</a></li>
                <li><a href="../../pages/navigation/jewelry.html">Jewelry</a></li>
                <li><a href="../../pages/navigation/shirts.html">Shirts</a></li>
                <li><a href="../../pages/navigation/pants.html">Pants</a></li>
                <li><a href="../../pages/login-signin/login.html">Login</a></li>
            </ul>
        </nav>

<!-- MAIN -->
 <br>
    <main class="login-container">
        <div>
            <h1>Welcome!</h1>   
            <p>Please log in to your account. <br>
               New here? <a href="../../pages/login-signin/signup.html">Create an account</a>.
            </p>
        </div>

        <form id="loginForm" action="../../index.html" method="POST">
            
            <div class="input-group">
                <label for="userEmail">Email Address</label>
                <input type="email" id="userEmail" name="email" placeholder="e.g., name@example.com" required autofocus>
            </div>

            <div class="input-group">
                <div class="label-wrapper">
                    <label for="userPassword">Password </label>
                </div>

                <div class="forgot-link-wrapper">
                    <a href="forgot.html" class="forgot-link">  Forgot password?</a>
                </div>
                    <input type="password" id="userPassword" name="password" placeholder="Enter your password" required>
                </div>

            <button type="submit" class="btn-primary">Log In</button>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="google-login">
                <button type="button" class="btn-google">Google</button>
            </div>
        </form>
    </main>
    
<br><br><br>

</body>
</html>
